# Production stack for the Contabo VPS — one host, everything containerized.
#
# Network design:
#   - kfl_internal (internal: true): Postgres/Mongo/Redis/MinIO/AI service live here
#     ONLY. No port is published to the host, so nothing outside this Docker network
#     can reach the databases directly — not even from the VPS's own public IP.
#   - kfl_public: nginx (the only container with published ports, 80/443) and api
#     (needs outbound internet for Stripe/CinetPay/SMTP/Google) both sit here too.
#   - api is attached to BOTH networks: reachable from nginx, and able to reach the
#     databases — but never directly reachable from the internet itself.
#   - garage is ALSO attached to both, same reasoning as api: it needs kfl_internal
#     to be written to by api, but nginx also needs to reach its website port
#     directly to serve public image reads (see nginx/nginx.conf's /media/ location)
#     — Postgres/Mongo/Redis have no such public-read use case and stay internal-only.
#
# This file is copied to the VPS once during initial setup (see scripts/vps-setup.sh)
# and is NOT what changes on every deploy — GitHub Actions only ever updates the
# `api` image tag and restarts that one service (see .github/workflows/deploy.yml).
# Edit this file on the VPS (or re-run vps-setup.sh) if the topology itself changes.

services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: kfl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - kfl_postgres_data:/var/lib/postgresql/data
    networks: [kfl_internal]

  mongodb:
    image: mongo:7
    container_name: kfl-mongodb
    restart: unless-stopped
    volumes:
      - kfl_mongo_data:/data/db
    networks: [kfl_internal]

  redis:
    image: redis:7-alpine
    container_name: kfl-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - kfl_redis_data:/data
    networks: [kfl_internal]

  # S3-compatible object store for avatars/menu photos/scan images. MinIO's image was
  # removed from free public Docker Hub distribution in 2025, so this uses Garage
  # (https://garagehq.deuxfleurs.fr) instead — same role, same S3 API surface from the
  # app's point of view (AWS_ENDPOINT/AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY).
  # One-time bootstrap after first `up` (see DEPLOYMENT.md): assign this node a layout,
  # create the bucket, create a key, grant it read/write, and enable bucket website
  # access (Garage only serves anonymous/unsigned reads through the website port, which
  # is why nginx proxies /media/ to it — see nginx/nginx.conf and AWS_PUBLIC_URL).
  garage:
    image: dxflrs/garage:v2.4.1
    container_name: kfl-garage
    restart: unless-stopped
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - kfl_garage_meta:/data/meta
      - kfl_garage_data:/data/data
    networks: [kfl_internal, kfl_public]

  # Placeholder — this image comes from the AI service's OWN repo/Dockerfile, which
  # isn't part of this backend project. Build and push it the same way as `api`
  # (its own GitHub Actions workflow, its own DockerHub repo), then point
  # AI_SERVICE_IMAGE at it. Until that exists, comment this service out and leave
  # AI_SERVICE_URL unset — src/modules/scan already fails clean (502) without it.
  ai-service:
    image: ${AI_SERVICE_IMAGE}
    container_name: kfl-ai-service
    restart: unless-stopped
    networks: [kfl_internal]

  api:
    image: ${DOCKERHUB_USERNAME}/kfl-backend:latest
    container_name: kfl-api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgres
      - mongodb
      - redis
      - garage
    networks: [kfl_internal, kfl_public]

  nginx:
    image: nginx:alpine
    container_name: kfl-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
    networks: [kfl_public]

networks:
  kfl_internal:
    internal: true
  kfl_public:

volumes:
  kfl_postgres_data:
  kfl_mongo_data:
  kfl_redis_data:
  kfl_garage_meta:
  kfl_garage_data:
