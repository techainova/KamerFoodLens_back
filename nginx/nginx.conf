# Reverse proxy — public entry point for the whole VPS. The mobile app (and any
# web client) only ever talks to this; api/postgres/mongo/redis/minio are all on
# the internal-only Docker network and have no route from the outside world.
#
# TLS: this ships listening on 80 only. Once you have a domain pointed at the
# VPS's IP, run certbot (see DEPLOYMENT.md "Adding HTTPS") to get a cert into
# ./nginx/certs and uncomment the 443 server block below.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  client_max_body_size 60m; # matches the backend's own 50MB Fastify bodyLimit + headroom

  upstream kfl_api {
    server api:3000;
  }

  # Garage (self-hosted S3-compatible object store) serves anonymous reads only through
  # its dedicated "website" port, not the S3 API port — the S3 API always requires a
  # signed request. Uploaded avatar/menu/scan-photo URLs point here (see AWS_PUBLIC_URL).
  upstream kfl_garage_web {
    server garage:3902;
  }

  server {
    listen 80;
    server_name _;

    location /media/ {
      # The bucket is already selected by the Host header below (Garage's website port
      # uses virtual-host-style bucket routing) — strip BOTH /media/ and the bucket name
      # (AWS_S3_BUCKET=kfl-media) so Garage only sees the object key itself.
      rewrite ^/media/kfl-media/(.*)$ /$1 break;
      proxy_pass http://kfl_garage_web;
      proxy_set_header Host kfl-media.web.garage.localhost;
    }

    location / {
      proxy_pass http://kfl_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # WebSocket upgrade — Socket.io (orders/notifications/messages gateways)
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }

  # server {
  #   listen 443 ssl;
  #   server_name your-domain.example.com;
  #
  #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
  #
  #   location / {
  #     proxy_pass http://kfl_api;
  #     proxy_http_version 1.1;
  #     proxy_set_header Host $host;
  #     proxy_set_header X-Real-IP $remote_addr;
  #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #     proxy_set_header X-Forwarded-Proto $scheme;
  #     proxy_set_header Upgrade $http_upgrade;
  #     proxy_set_header Connection "upgrade";
  #   }
  # }
}
